name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    name: tracked-files guard + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: No data, env, db, or vector-store files tracked
        run: |
          bad=$(git ls-files | grep -E '(^data/|(^|/)\.env$|(^|/)\.env\.local$|\.db$|\.sqlite3?$|(^|/)chroma[^/]*/|(^|/)chroma\.sqlite3$)' || true)
          if [ -n "$bad" ]; then
            echo "::error::Forbidden files are tracked:"
            echo "$bad"
            exit 1
          fi
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python:
    name: lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect lockfile
        id: lock
        run: |
          # Gate: skipped until pyproject.toml and uv.lock land (Stage 0). Remove the gate then.
          if [ -f pyproject.toml ] && [ -f uv.lock ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::pyproject.toml/uv.lock not present yet; skipping uv, ruff and pytest."
          fi
      - uses: astral-sh/setup-uv@v10
        if: steps.lock.outputs.present == 'true'
        with:
          python-version: "3.12"
      - name: Install (lockfile must be in sync)
        if: steps.lock.outputs.present == 'true'
        run: uv sync --locked
      - name: Lint
        if: steps.lock.outputs.present == 'true'
        run: uv run ruff check
      - name: Tests (no data, no LLM)
        if: steps.lock.outputs.present == 'true'
        run: uv run pytest -m "not needs_data and not needs_llm"
